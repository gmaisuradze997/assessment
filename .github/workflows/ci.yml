name: CI

on:
  push:
    branches: [main]
  pull_request:

# Brief order via job `needs` (fail-fast between stages):
# lint → typecheck → unit → build → Playwright → Lighthouse CI → bundle-size.
# Performance stays on its own runner so Playwright's Chromium install
# cannot starve the Lighthouse lab run.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Prettier + ESLint)
        run: npm run lint
      - name: Typecheck (svelte-check)
        run: npm run check
      - name: Unit tests
        run: npm test

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright + axe
        run: npx playwright test

  performance:
    needs: e2e
    runs-on: ubuntu-latest
    env:
      # Shared between preview server and lighthouserc.cjs cookie minting.
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

      # Lighthouse mobile, 3 runs/URL: LCP < 2s, CLS < 0.1, TBT < 200ms
      # (lab proxy for the INP budget), all categories >= 95.
      - name: Lighthouse CI
        run: npm run perf:lhci

      # Per-route initial JS (gzip): public <= 80 KB, dashboard <= 150 KB.
      - name: Bundle-size budget
        run: npm run perf:size

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
